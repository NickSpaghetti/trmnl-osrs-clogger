name: Update categories

# OSRS updates weekly (usually Wednesday). Re-bake TempleOSRS's collection log
# category map into src/transform.py and open a pull request if it changed.
on:
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-categories
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build development image
        run: make build-dev
      - name: Update category map
        run: make update-categories PR_BODY=_build/update-categories-pr.md
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/transform.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/transform.py
          fi
      # Pull requests opened with GITHUB_TOKEN don't trigger the CI workflow,
      # so lint and test here before opening one.
      - name: trmnlp lint
        if: steps.diff.outputs.changed == 'true'
        run: make lint
      - name: trmnlp test
        if: steps.diff.outputs.changed == 'true'
        env:
          CI: "true"
        run: make plugin-test
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          sign-commits: true
          branch: automation/update-categories
          delete-branch: true
          add-paths: src/transform.py
          commit-message: updated collection log categories
          title: updated collection log categories
          body-path: _build/update-categories-pr.md
