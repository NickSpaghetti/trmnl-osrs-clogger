schemaVersion: "2.0.0"

metadataTest:
  exposedPorts: ["4567"]
  workdir: "/plugin"
  cmd: ["serve", "--bind", "0.0.0.0"]

fileExistenceTests:
  - name: trmnlp project config
    path: /plugin/.trmnlp.yml
    shouldExist: true
  - name: plugin settings
    path: /plugin/src/settings.yml
    shouldExist: true
  - name: serverless transform
    path: /plugin/src/transform.py
    shouldExist: true
  - name: full view
    path: /plugin/src/full.liquid
    shouldExist: true
  - name: half horizontal view
    path: /plugin/src/half_horizontal.liquid
    shouldExist: true
  - name: half vertical view
    path: /plugin/src/half_vertical.liquid
    shouldExist: true
  - name: quadrant view
    path: /plugin/src/quadrant.liquid
    shouldExist: true
  - name: shared markup
    path: /plugin/src/shared.liquid
    shouldExist: true
  - name: build output excluded
    path: /plugin/_build
    shouldExist: false
  - name: test report excluded
    path: /plugin/report
    shouldExist: false

commandTests:
  - name: trmnlp is installed
    command: trmnlp
    args: ["version"]
    expectedOutput: ["[0-9]+\\.[0-9]+\\.[0-9]+"]
  - name: python3 available for transform.py
    command: python3
    args: ["--version"]
    expectedOutput: ["Python 3"]
